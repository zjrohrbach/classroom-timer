<!DOCTYPE html>
<html lang="en">
  <head>    
    <meta charset="utf-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daily Alarms</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <style> 
      td { width: 50%; height: 70px; } 
      dialog { width: 90%; height: 90%; display: flex; align-items: top; }
      .modal .tag:hover {
        text-decoration: line-through;
        cursor: pointer;
        background-color: #f5f5f5;
        color: #363636;
      }
      .checkbox {
        display: block; 
        width: 100%;
        padding: 2px;
      }
      .checkbox input[type="checkbox"] {
        margin-right: 10px
      }
      /*.box {
        padding: 5px
      }*/
      .sticky {
        position: sticky;
        top: 0;
      }
      .modal-content,
      .modal-card {
        width: 95%;
      }
      /*nav  ul {
        list-style-type: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
      }*/
    </style>
  </head>
  <body>
    <audio controls id="sound1" class="is-hidden">
      <source src="sound1.mp3" type="audio/mp3">
    </audio>
    <div class="container">
      <div class="columns is-8 m-2">
        <section class="column">
          <h1 class="title is-1">Classroom Timer</h1>
          <div class="block">
            <pre id="displayTime" class="is-size-3">00:00:00 xm</pre>
          </div>
          <details class="block">
            <summary>Adjust Clock</summary>
            <div class="field has-addons is-horizontal m-2 ml-5">
              <label class="label is-small m-2" for="offsetSecs">Clock Offset:</label>
              <div class="control">
                <input type="number" class="input is-small" id="offsetSecs" min="-600" max="600"> 
              </div>
              <div class="control">
                <a class="button is-small is-static">seconds</a>
              </div> 
            </div>
          </details>
          <nav class="tabs is-toggle">
            <ul id="schedOptions"></ul>
          </nav>
          <div>
            <button class="button is-small is-light open-modal" command="show-modal" commandfor="editor-modal" type="button" id="open-editor-modal">Edit Schedules</button>
            <button class="button is-small is-light is-info" id="test-alarm">Test Alarm</button>
          </div>
        </section>
        <div class="modal" id="editor-modal">
          <div class="modal-background"></div>
          <div class="modal-card">
            <header class="modal-card-head">
              <p class="modal-card-title">Schedule Editor</p>
            </header>
            <section class="modal-card-body" id="editor-window">
              <div class="tabs is-boxed is-small">
                <ul id="list-of-schedules">
                </ul>
              </div>
              <div class="columns">
                <section class="column is-two-thirds">
                  <h2 contenteditable="plaintext-only" id="current-schedule-title" class="title is-5 has-background-light p-2 m-0">Undefined</h2>
                  <div id="schedule-container"></div>
                  <div class="buttons m-3 is-centered">
                    <button class="button is-danger is-fullwidth is-outlined" id="delete-current-schedule">Delete This Schedule</button>
                  </div>   
                </section>
                <section class="column">
                  <div class="box sticky">
                    <h3 class="title is-3">Add Alarms</h3>
                    <div class="field">
                      <label for="num-mins" class="label">Add Alarm</label>
                      <div class="field has-addons ">
                        <p class="control"><input type="number" class="input" id="num-mins" min="1" max="10" value="1"></p>
                        <p class="control"><a class="button is-static">minutes</a></p>
                      </div>
                      <div class="field is-grouped">
                        <p class="control"><button class="button" id="after-start">after Start Bell</button></p>
                        <p class="control"><button class="button" id="before-end">before End Bell</button></p>
                      </div>
                    </div>
                    <div class="field">
                      <div class="label">to these periods:</div>
                      <div id="period-checkboxes" class="checkboxes"></div>
                    </div>
                  </div>
                </section>
              </div>
            </section>
            <footer class="modal-card-foot buttons is-right">
              <button class="button is-success" id="save-changes">Save changes</button>
              <button class="button" id="discard-changes">Discard changes</button>
            </footer>
          </div>
        </div>
        <section class="column card">
          <h2 class="title is-3" id="scheduleName">No Schedule Chosen</h2>
          <p class="block">Current Period: <span id="currentPeriod">undefined</span></p>
          <div class="columns is-mobile is-vcentered">
            <div class="column is-2-desktop is-one-quarter-mobile is-one-quarter-tablet has-text-right">
              <span id="timeElapsed" class="tag is-primary is-light">0:00:00</span>
            </div>
            <div class="column is-relative p-0" id="progressContainer">
              <progress class="progress is-primary" value="0" max="100" id="progressBar"></progress>
            </div>
            <div class="column is-2-desktop is-one-quarter-mobile is-one-quarter-tablet has-text-left">
              <span id="timeToGo" class="tag is-primary is-light">0:00:00</span>
            </div>
          </div>
          <table class="table is-stripe is-fullwidth" id="schedTable">
            <thead>
              <tr>
                <th>Time</th>
                <th>Period</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="2">Please Pick a Schedule</td>
              </tr>
            </tbody>
          </table>
        </section>
      </div>
    </div>
    <script src="ui.js"></script>
    <script src="core.js"></script>
    <script src="editor.js"></script>
  </body>
</html>
