<!DOCTYPE html>
<html>

<head>
  <title>Schedule Editor</title>
  <!--<link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >-->
  <style>
    .alarm {
      background-color: blue;
      color: white;
      margin: 0px 3px;
    }

    .alarm:hover {
      text-decoration: line-through;
      cursor: pointer;
    }

    .current-schedule {
      font-weight: bold;
      color: red;
    }
  </style>
</head>

<body>
  <h1>Classroom Timer</h1>
  <nav>
    <ul id="list-of-schedules">
    </ul>
  </nav>
  <main>
    <h2>Schedule Editor</h2>
    <section id="schedule-container"></section>
    <section>
      <h3>Add Alarms</h3>
      <label for="num-mins">Add Alarm</label>
      <input type="number" id="num-mins" min="1" max="10" value="1">
      minutes
      <input type="button" id="after-start" value="after Start Bell">
      <input type="button" id="before-end" value="before End Bell">
      <div id="period-checkboxes"></div>
    </section>
  </main>
  <pre id="output-json">

  </pre>
  <script src="editor.js"></script>
</body>

</html>
